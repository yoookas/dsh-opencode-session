# 打版本号标签（v1.2.3）时：校验标签与 package.json 版本一致 → 跑测试 →
# 用 `npm pack` 打出插件包 → 连同 SHA256SUMS 一起发布到 GitHub Release。
#
# 发布后可直接安装：
#   dsh plugin --profile web add https://github.com/<owner>/<repo>/releases/download/<tag>/dsh-opencode-session-<version>.tgz
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "tag:     ${GITHUB_REF_NAME}"
          echo "package: ${package_version}"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}; bump package.json or retag"
            exit 1
          fi

      - name: Test
        run: node --test test/*.test.js

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Show package contents
        run: tar -tzf dist/*.tgz | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}" \
            dist/*.tgz dist/SHA256SUMS.txt
